name: build

on:
  push:
    branches: [master, main, phase-216-*]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify (all 1,285 assertions + sha256 receipt)
        run: |
          make verify
      - name: Show receipt
        run: |
          cat VERIFY_RECEIPT.json
      - name: Build static library
        run: |
          make
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quilt-c-build
          path: |
            build/
            VERIFY_RECEIPT.json
